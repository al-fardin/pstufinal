openapi: 3.1.0
info:
  title: Valerix Inventory Service API
  version: 1.0.0

servers:
  - url: http://localhost:3002

paths:
  /api/v1/inventory/adjustments:
    post:
      summary: Apply an idempotent inventory adjustment
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TestFaultMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjustmentRequest'
      responses:
        '200':
          description: Applied or previously applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAdjustmentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/inventory/{productId}:
    get:
      summary: Get product stock
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Stock information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemEnvelope'
        '404':
          description: Product not found

  /health:
    get:
      summary: Dependency-aware Inventory health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: Prometheus text format

components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid

    TestFaultMode:
      name: X-Test-Fault-Mode
      in: header
      required: false
      schema:
        type: string
        enum:
          - none
          - latency
          - crash_after_commit

  schemas:
    AdjustmentItem:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1

    InventoryAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [operationId, orderId, correlationId, items]
      properties:
        operationId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        correlationId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdjustmentItem'

    AppliedItem:
      type: object
      required: [productId, quantity, remainingStock]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        remainingStock:
          type: integer
          minimum: 0

    AdjustmentOutcome:
      type: string
      enum:
        - APPLIED
        - ALREADY_APPLIED

    InventoryAdjustment:
      type: object
      required: [operationId, orderId, outcome, items, appliedAt]
      properties:
        operationId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/AdjustmentOutcome'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppliedItem'
        appliedAt:
          type: string
          format: date-time

    Meta:
      type: object
      required: [correlationId]
      properties:
        correlationId:
          type: string
          format: uuid

    InventoryAdjustmentEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/InventoryAdjustment'
        meta:
          $ref: '#/components/schemas/Meta'

    InventoryItem:
      type: object
      required: [productId, availableStock]
      properties:
        productId:
          type: string
        availableStock:
          type: integer
          minimum: 0

    InventoryItemEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/InventoryItem'
        meta:
          $ref: '#/components/schemas/Meta'

    Error:
      type: object
      required: [code, message, retryable, correlationId, details]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        correlationId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    DependencyHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]

    Health:
      type: object
      required: [status, service, dependencies]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        service:
          type: string
          const: inventory-service
        dependencies:
          type: object
          required: [database]
          properties:
            database:
              $ref: '#/components/schemas/DependencyHealth'

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Business conflict such as insufficient stock
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
